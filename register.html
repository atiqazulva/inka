<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar – Platform Media Pembelajaran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <main class="page">
    <!-- Brand Identity -->
    <header class="brand">
      <img class="brand__lamp" src="public/logo-inka.png" alt="" width="65" height="85" />
      <h1 class="brand__title">Selamat Datang Kembali</h1>
      <p class="brand__tagline">Platform Media Pembelajaran lengkap, UMKM Sejahtera.</p>
    </header>

    <!-- Registration Form Card -->
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Form pendaftaran</h2>

      <form id="registerForm" class="form" novalidate>
        <!-- Nama Lengkap -->
        <div class="field">
          <div class="field__control">
            <img class="field__icon" src="public/profil.png" alt="" width="16" height="16" />
            <label class="visually-hidden" for="name">Nama Lengkap</label>
            <input class="field__input" type="text" id="name" name="name" placeholder="Nama Lengkap" autocomplete="name" required />
          </div>
          <p class="field__error" id="nameError" role="alert"></p>
        </div>

        <!-- E-mail -->
        <div class="field">
          <div class="field__control">
            <img class="field__icon" src="public/email.png" alt="" width="20" height="16" />
            <label class="visually-hidden" for="email">E-mail</label>
            <input class="field__input" type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required />
          </div>
          <p class="field__error" id="emailError" role="alert"></p>
        </div>

        <!-- Kata Sandi -->
        <div class="field">
          <div class="field__control">
            <img class="field__icon" src="public/kunci.png" alt="" width="16" height="21" />
            <label class="visually-hidden" for="password">Buat Kata Sandi</label>
            <input class="field__input" type="password" id="password" name="password" placeholder="Buat Kata Sandi" autocomplete="new-password" required />
          </div>
          <p class="field__error" id="passwordError" role="alert"></p>
        </div>

        <!-- Dropdown -->
        <div class="field">
          <div class="field__control">
            <img class="field__icon" src="public/kategori.png" alt="" width="19" height="20" />
            <label class="visually-hidden" for="sector">Industri Kreatif</label>
            <select class="field__input field__select" id="sector" name="sector" required>
              <option value="" selected>Industri Kreatif</option>
              <option value="kuliner">Kuliner</option>
              <option value="fashion">Fashion</option>
              <option value="kriya">Kriya</option>
              <option value="desain">Desain</option>
              <option value="fotografi">Fotografi</option>
              <option value="musik">Musik</option>
              <option value="lainnya">Lainnya</option>
            </select>
            <img class="field__chevron" src="public/dropdown.png" alt="" width="18" height="12" />
          </div>
          <p class="field__error" id="sectorError" role="alert"></p>
        </div>

        <!-- CTA -->
        <button class="btn-cta" type="submit">
          <span>Buat Akun</span>
          <img src="public/panah.png" alt="panah asmara" width="12" height="12" />
        </button>
      </form>
    </section>

    <!-- Footer -->
    <p class="signin">
      Sudah punya akun?
      <a href="login.html" id="signinLink">Masuk</a>
    </p>
  </main>

  <div class="bottom-bar" aria-hidden="true"></div>

  <script src="register.js"></script>
</body>
</html>
